name: Build FAAM Windows EXE

# Builds the packaged Windows app (FAAM.exe) on a Microsoft-hosted Windows
# runner, so you don't need a Windows machine yourself.
#
# Place this file at your repository root as .github/workflows/build-windows.yml
# (it assumes the FAAM project — winshell.py, app.py, static/ — is at the repo
# root; if FAAM lives in a subfolder, set `working-directory` and the artifact
# `path` accordingly).
#
# Run it from the Actions tab (Run workflow), or it runs automatically on a
# version tag like v1.0.0. The built exe appears as a downloadable artifact.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    # Needed so a tag build can attach FAAM.exe to a GitHub Release.
    # (GitHub's default workflow token is often read-only.)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install pywebview pyinstaller

      # Bake the AI key into the build so users never paste anything.
      # The value comes from the repo secret OPENAI_API_KEY and is written only
      # on the runner — it is never committed to this (public) repository.
      # No secret set => an empty file => FAAM still runs, just without the AI.
      - name: Bundle AI key from repo secret
        shell: pwsh
        env:
          FAAM_AI_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAAM_DATA_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          Set-Content -Path key -Value "$env:FAAM_AI_KEY" -NoNewline -Encoding ascii
          Set-Content -Path alphavantage_key -Value "$env:FAAM_DATA_KEY" -NoNewline -Encoding ascii
          if ((Get-Item key).Length -gt 0) { "AI key bundled (value hidden)" } else { "no AI key secret set - building without it" }

      - name: Build FAAM.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name FAAM
          --icon FAAM.ico
          --add-data "static;static"
          --add-data "advisers;advisers"
          --add-data "app.py;."
          --add-data "key;."
          --add-data "alphavantage_key;."
          --hidden-import app
          winshell.py

      - name: Remove key files from the workspace
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue key, alphavantage_key

      - name: Upload FAAM.exe
        uses: actions/upload-artifact@v4
        with:
          name: FAAM-windows
          path: dist/FAAM.exe

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FAAM.exe
